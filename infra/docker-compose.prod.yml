name: cspm-prod

services:
  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: s3,ec2,iam
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:4566/_localstack/health >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    # Production secrets (DATABASE_URL, JWT_SECRET, ADMIN_EMAIL,
    # CORS_ALLOW_ORIGINS) come from this file on the deployment host, never
    # committed and never passed as ${VAR} compose substitution -- Compose
    # silently substitutes an empty string for an unset shell var, which
    # breaks these at container startup instead of failing where it's
    # obvious. See .env.production.example for the required shape.
    env_file:
      - ../.env.production
    environment:
      CSPM_ENV: production
      SECURE_COOKIES: "true"
      LOCALSTACK_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "8000:8000"
    volumes:
      - ../scripts:/scripts:ro
      - ../rules:/rules:ro
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  localstack_data: